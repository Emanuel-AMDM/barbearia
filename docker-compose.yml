services:
  mysql:
    image: mysql:8.4
    container_name: barbearia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: barbearia
    ports:
      - "3309:3306"
    volumes:
      - barbearia-mysql-data:/var/lib/mysql

volumes:
  barbearia-mysql-data:
